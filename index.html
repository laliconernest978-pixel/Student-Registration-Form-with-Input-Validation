<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Seminar Student Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>IT Seminar Student Registration</h1>

    <form id="registrationForm" novalidate>
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          required 
          aria-describedby="fullNameError"
          aria-invalid="false"
        >
        <div id="fullNameError" class="error-message" role="alert"></div>
      </div>

      <!-- Student Number -->
      <div class="form-group">
        <label for="studentNumber">Student Number</label>
        <input 
          type="text" 
          id="studentNumber" 
          name="studentNumber" 
          placeholder="e.g. 24-1234-123"
          required 
          aria-describedby="studentNumberError"
          aria-invalid="false"
        >
        <div id="studentNumberError" class="error-message" role="alert"></div>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          aria-describedby="emailError"
          aria-invalid="false"
        >
        <div id="emailError" class="error-message" role="alert"></div>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label for="mobileNumber">Mobile Number</label>
        <input 
          type="tel" 
          id="mobileNumber" 
          name="mobileNumber" 
          placeholder="09123456789 or +639123456789"
          required 
          aria-describedby="mobileNumberError"
          aria-invalid="false"
        >
        <div id="mobileNumberError" class="error-message" role="alert"></div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          aria-describedby="passwordError passwordFeedback"
          aria-invalid="false"
        >
        <div id="passwordFeedback" class="info-feedback"></div>
        <div id="passwordError" class="error-message" role="alert"></div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          required 
          aria-describedby="confirmPasswordError"
          aria-invalid="false"
        >
        <div id="confirmPasswordError" class="error-message" role="alert"></div>
      </div>

      <!-- Course Selection -->
      <div class="form-group">
        <label for="course">Course</label>
        <select 
          id="course" 
          name="course" 
          required 
          aria-describedby="courseError"
          aria-invalid="false"
        >
          <option value="" disabled selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <div id="courseError" class="error-message" role="alert"></div>
      </div>

      <!-- Terms Agreement -->
      <div class="form-group checkbox-group">
        <label for="terms">
          <input 
            type="checkbox" 
            id="terms" 
            name="terms" 
            required 
            aria-describedby="termsError"
            aria-invalid="false"
          >
          I agree to the Terms and Conditions
        </label>
        <div id="termsError" class="error-message" role="alert"></div>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <!-- Success Message Container -->
    <div id="successMessage" class="success-message" role="status"></div>

    <!-- Registration Summary Container -->
    <div id="registrationSummary" class="summary-container" hidden>
      <h2>Registration Summary</h2>
      <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
      <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
      <p><strong>Email Address:</strong> <span id="summaryEmail"></span></p>
      <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
      <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
